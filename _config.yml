title: "Programando a Pasitos"
tagline: "No es un bug, es una característica no documentada"
description: "Tutoriales de programación en español: Java, SQL y bases de datos, Python, Android y desarrollo web, con ejemplos de código paso a paso."
home_title: "Tutoriales de Java, SQL, Python y Android"
author:
  name: Inazio Claver
  url: https://github.com/inazense

url: "https://programandoapasitos.com"
baseurl: ""

lang: es
timezone: Europe/Madrid

permalink: /posts/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      image: /img/profile.png
  - scope:
      path: "pages"
    values:
      layout: "page"
      image: /img/profile.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from

logo: /img/profile.png

# Imagen por defecto cuadrada: tarjeta pequeña en redes
twitter:
  card: summary

paginate: 10
paginate_path: "/page/:num/"

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md

include:
  - pages

feed:
  path: feed.xml

giscus:
  repo: inazense/inazense.github.io
  repo_id: R_kgDOSCW1ng
  category: General
  category_id: DIC_kwDOSCW1ns4C6-xJ
  mapping: pathname
  reactions_enabled: "1"
  input_position: bottom
  lang: es
